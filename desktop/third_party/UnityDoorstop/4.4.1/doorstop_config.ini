# Unity Doorstop compatibility shell for KeyViewer.
#
# KeyViewer is already a .NET 10/CoreCLR application, not a Unity Mono or
# IL2CPP process. Its in-process bootstrap loads Managed, Native and BepInEx
# content directly. Enabling Unity injection here would search for a Unity
# runtime that does not exist and prevent startup.

[General]
enabled=false
target_assembly=
redirect_output_log=false
boot_config_override=
ignore_disable_switch=false

[UnityMono]
dll_search_path_override=
debug_enabled=false
debug_address=127.0.0.1:10000
debug_suspend=false

[Il2Cpp]
coreclr_path=
corlib_dir=
