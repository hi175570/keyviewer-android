apply plugin: 'com.android.library'

android {
    namespace 'com.KV.bridge'
    compileSdkVersion 36
    ndkVersion '27.3.13750724'

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 30
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        aidl true
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java', '../app/src/main/java']
            java.includes = [
                    'com/KV/bridge/**',
                    'com/KV/InputGrabberMain.java',
                    'com/KV/NativeInput.java',
                    'com/KV/KeyInjector.java',
                    'com/KV/IpcService.java'
            ]
            aidl.srcDirs = ['../app/src/main/aidl']
        }
    }

    externalNativeBuild {
        cmake {
            path file('../app/src/main/cpp/CMakeLists.txt')
        }
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
}
