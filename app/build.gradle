apply plugin: 'com.android.application'

android {
    namespace 'com.KV'
    compileSdkVersion 30
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId "com.KV"
        minSdkVersion 24
        targetSdkVersion 30
        versionCode 100
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // libkvsocket is built only for the two supported 64-bit ABIs. Without this
        // filter JNA also contributes obsolete 32-bit/MIPS libraries, producing APKs
        // that install on devices where the required injection library cannot load.
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        aidl true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    lint {
        // This project is distributed locally; raising targetSdk requires a separate
        // Android 13-15 permission and foreground-service behavior migration.
        disable 'ExpiredTargetSdkVersion'
    }

    // 移除手动指定 sourceSets，恢复默认
    // sourceSets {
    //     main {
    //         aidl.srcDirs = ['src/main/aidl']
    //         ...
    //     }
    // }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    // JNA lets the standalone Shizuku shell helper call EVIOCGRAB without another
    // JNI service; libkvsocket itself is built above from the checked-in C source.
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}
